name: Splunk Observability as Code

on:
  push:
    paths:
      - 'dashboards/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Splunk Dashboard JSON
        run: python scripts/build_dashboard.py

      - name: Deploy to Splunk Observability Cloud
        run: |
          curl -X POST https://api.us1.signalfx.com/v2/dashboard \
          -H "Content-Type: application/json" \
          -H "X-SF-TOKEN: ${{ secrets.SPLUNK_TOKEN }}" \
          -d @dashboard.json
